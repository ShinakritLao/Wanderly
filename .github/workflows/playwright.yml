name: Playwright Tests

on:
  push:
    branches: [Ui-tests ]
  pull_request:
    branches: [ Ui-tests ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: cd Wanderly/ui-tests && npm install

      - name: Install Playwright Browsers
        run: cd Wanderly/ui-tests && npx playwright install --with-deps

      - name: Run Playwright tests
        run: cd Wanderly/ui-tests && npx playwright test
